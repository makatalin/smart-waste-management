<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
    <link rel="stylesheet" href="korisnici.css">
</head>
<body>
    <div id="navbar">
        <a href="index.html">Bins</a>
        <a href="korisnici.html" class="active">Users</a>
        <a href="izvjestaji.html">Reports</a>
    </div>
    
    <div id="content">
        <button id="dodaj-korisnika-btn">Add user</button>
        <!-- Search field -->
        <input type="text" id="pretraga-korisnika" placeholder="Search...">

        <div class="user-details-container" id="korisnici-lista">
            <!-- List of users -->
        </div>
    </div>

    <!-- Hidden forms -->
    <div id="form-container">
        <div id="dodaj-korisnika-form" class="form-container" style="display:none;">
            <h2>Add/Edit user</h2>
            <form>
                <input type="hidden" id="korisnik-id" name="korisnik-id"><br>
                <label for="ime">First name:</label>
                <input type="text" id="ime" name="ime" required><br>
                <label for="prezime">Last name:</label>
                <input type="text" id="prezime" name="prezime" required><br>
                <label for="ulica">Street:</label>
                <input type="text" id="ulica" name="ulica" required><br>
                <label for="broj">Number:</label>
                <input type="text" id="broj" name="broj" required><br>
                <label for="grad">City:</label>
                <input type="text" id="grad" name="grad" required><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required><br>
                <label for="telefon">Phone:</label>
                <input type="phone" id="telefon" name="telefon" required><br>
                <div id="spremnici-container">
                    <label for="spremnici">Assign bins:</label>
                    <div id="dostupni-spremnici-lista">
                        <!-- Bins assigned to user -->
                    </div>
                </div>
                <div id="odjava-container" style="display: block;">
                    <label for="odjava">Deactivate user?</label>
                    <input type="checkbox" id="odjava" name="odjava"><br>
                </div>
                <button type="submit" id="spremi-btn">Save</button>
                <button type="button" id="odustani">Cancel</button>
            </form>
        </div>
    </div>

    <script src="korisnici.js"></script>
</body>
</html>
